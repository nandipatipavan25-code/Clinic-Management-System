<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ms-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ms-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="ms-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Squircle with Glass Depth -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ms-bg)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Medical Cross Geometry -->
  <rect x="26" y="14" width="12" height="36" rx="6" fill="#ffffff" opacity="0.95" />
  <rect x="14" y="26" width="36" height="12" rx="6" fill="#ffffff" opacity="0.95" />

  <!-- Smart Digital Pulse Wave ("M" Curve) Overlay -->
  <path d="M 17 32 H 24 L 28 22 L 32 42 L 36 22 L 40 32 H 47" 
        fill="none" 
        stroke="url(#ms-pulse)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#ms-glow)" />

  <!-- Center Heartbeat Core Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#2563eb" />
  <circle cx="32" cy="32" r="1.5" fill="#38bdf8" />
</svg>
